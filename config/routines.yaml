# JARVIS routine registry — the time-based loop.
#
# Every unattended, scheduled job JARVIS runs is declared here. Nothing is
# scheduled by hand-written units any more: scripts/gen_routine_units.py
# renders one `jarvis-routine-<name>.service` + `.timer` pair per entry into
# deploy/systemd/, remote_install.sh enables every `jarvis-routine-*.timer`
# it finds, and the cockpit's Scheduled pane lists them automatically.
#
# Lifecycle of a run:
#   timer fires -> scripts/run_routine.py <name> -> event_log.job(<name>)
#   -> the routine's script runs with a hard timeout -> stdout/stderr land
#   in $JARVIS_DATA_DIR/routines/<name>/runs/ -> last stdout line becomes
#   the job summary the cockpit shows.
#
# Fields:
#   description:      one line; becomes the unit Description
#   schedule:         systemd OnCalendar expression (local time on the host)
#   kind:             shell — a script run as a subprocess, no brain, no
#                     shared session.
#                     goal  — run-to-green (ADR-0002): the goal runner iterates
#                     on `repo` until `condition` exits 0, then hands off a
#                     branch + patch. Fields: repo, base, condition, commands,
#                     paths, setup, unprotect, budget, max_changed_lines, model.
#   script:           (shell) repository-relative path, run with the jarvis venv
#   args:             (shell) argv appended to the script
#   timeout_minutes:  hard kill; mirrored into the unit as TimeoutStartSec
#   jitter_seconds:   RandomizedDelaySec on the timer (default 0)
#   enabled:          false renders the units but leaves the timer disabled
#
# After editing this file:  py scripts/gen_routine_units.py   (then commit
# the regenerated units; CI runs the same script with --check).

routines:

  conformance-sweep:
    description: >
      Nightly JAM conformance sweep: clone every conforming repo, run
      `jam validate --json`, diff against the previous run, report drift;
      watch JAM for releases and prepare adoption branches for repos behind.
    schedule: "Mon..Fri 05:30:00"
    kind: shell
    script: scripts/routines/conformance_sweep.py
    args:
      - --jam-ref
      - main
      - --propagate          # prepare chore/jam-vX.Y.Z branches + patches; never pushes
      - --repo
      - atlas=https://github.com/barelysmash/atlas
      - --repo
      - jarvis-v2=https://github.com/barelysmash/jarvis-v2
    timeout_minutes: 30
    jitter_seconds: 120
    enabled: true

  jarvis-memory-mypy:
    description: >
      Run-to-green (ADR-0002): make orchestrator/memory pass mypy --strict with
      the runtime packages installed — the chromadb typing debt CI cannot see.
      Prepares goal/jarvis-memory-mypy + a patch; never pushes.
    schedule: "Sat 06:00:00"
    kind: goal
    repo: https://github.com/barelysmash/jarvis-v2
    base: main
    setup:
      - python -m pip install --quiet --upgrade pip
      - python -m pip install --quiet -r requirements-dev.txt -r requirements.txt
    condition: python -m mypy --strict orchestrator/memory
    commands:
      mypy: python -m mypy --strict orchestrator/memory
      tests: python -m pytest -q tests
    paths:
      - orchestrator/memory/**
    budget: {iterations: 10, minutes: 20, tokens: 400000}
    max_changed_lines: 200
    timeout_minutes: 25
    jitter_seconds: 120
    # Probed on guildenstern 2026-10-21: 8 mypy errors in semantic.py, venv +
    # setup fine. Re-probe any time (setup + condition only, no model):
    #   ssh ocelia@guildenstern 'cd ~/jarvis && JARVIS_DATA_DIR=~/jarvis-data \
    #     ~/jarvis-venv/bin/python orchestrator/goal_runner.py jarvis-memory-mypy --probe'
    enabled: true
