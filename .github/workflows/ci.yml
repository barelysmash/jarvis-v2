name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hud

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hud/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build production HUD
        run: npm run build

      - name: Verify production HUD artifact
        run: test -s dist/index.html

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "httpx>=0.27.0,<1.0" ruff==0.16.1 mypy==2.3.0 pytest==8.4.2

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: |
          python -m mypy             orchestrator             server             tools             voice             workflows             scripts             main.py             voice-client/voice_client.py             patch_hud_v216.py

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest
