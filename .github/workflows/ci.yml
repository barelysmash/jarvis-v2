name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install             "httpx>=0.27.0,<1.0"             ruff==0.16.1             mypy==2.3.0             pytest==8.4.2

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: |
          python -m mypy             orchestrator             server             tools             voice             workflows             scripts             main.py             voice-client/voice_client.py             patch_hud_v216.py

      - name: Tests
        run: python -m pytest
